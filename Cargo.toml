[package]
name = "uuid-readable-rs"
version = "0.2.0"
authors = ["Martichou <martichou.andre@gmail.com>", "Alec Flett"]
edition = "2018"
repository = "https://github.com/alecf/uuid-tokenized-rs"
description = "Compact, URL-safe, bijective UUIDs encoded as tokens from an LLM tokenizer's vocabulary"
keywords = ["uuid", "tokenizer", "url-safe", "sentencepiece", "encoding"]
license = "AGPL-3.0"
readme = "README.md"

categories = ["data-structures", "parser-implementations"]

[features]
default = ["cli"]
# Pulls in the `tokenizers` crate so the CLI can count tokens with --verbose.
# Library consumers can opt out: `default-features = false`.
cli = ["dep:tokenizers"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
uuid = { version = "1.9", features = ["v4"] }
tokenizers = { version = "0.20", optional = true }

[[bin]]
name = "main"
required-features = ["cli"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
